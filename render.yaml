services:
  - type: web
    name: investiq-ai
    env: node
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && npm install"
    startCommand: "cd backend && npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_VERSION
        value: v1
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_COOKIE_EXPIRES_IN
        value: "7"
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: REDIS_URL
        value: ""
      - key: FRONTEND_URL
        value: "https://investiq-ai.onrender.com"
      - key: FRONTEND_PROD_URL
        value: "https://investiq-ai.onrender.com"
      - key: BASE_URL
        value: "https://investiq-ai.onrender.com"
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "5000"
      - key: LOG_LEVEL
        value: info
